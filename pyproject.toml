[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-analytics-agent"
version = "0.4.0"
description = "Local-first tool that pulls your Roblox game's analytics into a SQLite database."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
# The desktop app's own window and tray icon. Without them it opens in your browser.
app = ["pywebview>=5", "pystray>=0.19", "Pillow>=10"]

[project.scripts]
roblox-agent = "roblox_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roblox_agent = ["app/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# The desktop app must keep running when an optional extra (window, tray) or a
# network lookup fails, so it deliberately catches broad errors there.
"src/roblox_agent/app/*" = ["BLE001", "S110"]
